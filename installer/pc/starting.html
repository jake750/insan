<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insan</title>
<style>
  :root { --bg: #f2f2f8; --ink: #1d1a2e; --ink-2: #5b5675; --brand: #8047e1; --track: #e2ddf3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0e18; --ink: #ecebf5; --ink-2: #a39fbd; --brand: #a57cf0; --track: #2a2640; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 16px; }
  .ring { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--track); border-top-color: var(--brand); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ring { animation-duration: 3s; } }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
</style>
</head>
<body>
<main>
  <div class="ring" aria-hidden="true"></div>
  <h1>Starting Insan… <span dir="rtl" lang="ar">جارٍ تشغيل إنسان…</span></h1>
  <p id="note">The first start after installing can take up to half a minute.</p>
</main>
<script>
  // The launcher passes the app address after "#". Switch to it as soon as the local server answers.
  const url = decodeURIComponent(location.hash.slice(1)) || "http://127.0.0.1:3219/";
  const started = Date.now();
  async function poll() {
    try {
      await fetch(url, { mode: "no-cors", cache: "no-store" });
      location.replace(url);
      return;
    } catch {}
    if (Date.now() - started > 90000) {
      document.getElementById("note").textContent = "Insan did not start. Close this window and open Insan again.";
      return;
    }
    setTimeout(poll, 400);
  }
  poll();
</script>
</body>
</html>
