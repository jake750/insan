<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insan</title>
<style>
  :root { --bg: #f1f3f8; --ink: #141d2d; --ink-2: #444d5e; --line: #1d2d4e; --dot: #eea82f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a0f1a; --ink: #e8ebf2; --ink-2: #b5bbc7; --line: #e8ebf2; --dot: #eea82f; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 16px; }
  /* the living line: writes itself, then a saffron pulse runs along it until the app answers */
  .live { width: 120px; height: 24px; overflow: visible; }
  .live path { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .live .l { stroke: var(--line); stroke-dasharray: 100; animation: write 1s cubic-bezier(0.32, 0.72, 0, 1) both; }
  .live .p { stroke: var(--dot); stroke-dasharray: 20 200; stroke-dashoffset: 20; animation: run 1.3s cubic-bezier(0.45, 0, 0.3, 1) 0.9s infinite; }
  .live circle { fill: var(--dot); transform-box: fill-box; transform-origin: center; animation: beat 1.3s ease-in-out 0.9s infinite; }
  @keyframes write { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  @keyframes run { from { stroke-dashoffset: 20; } to { stroke-dashoffset: -100; } }
  @keyframes beat { 0%, 45%, 100% { transform: scale(1); } 10% { transform: scale(1.45); } 20% { transform: scale(1.05); } 30% { transform: scale(1.3); } }
  @media (prefers-reduced-motion: reduce) { .live .l, .live circle { animation: none; } .live .p { animation-duration: 3s; } }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
</style>
</head>
<body>
<main>
  <svg class="live" viewBox="0 0 120 24" aria-hidden="true">
    <path class="l" pathLength="100" d="M3 12H42C46 12 46 4 50 4C54 4 54 20 59 20C64 20 64 7 68 7C72 7 72 12 78 12H117"/>
    <path class="p" pathLength="100" d="M3 12H42C46 12 46 4 50 4C54 4 54 20 59 20C64 20 64 7 68 7C72 7 72 12 78 12H117"/>
    <circle cx="3" cy="12" r="2.6"/>
  </svg>
  <h1>Starting Insan… <span dir="rtl" lang="ar">جارٍ تشغيل إنسان…</span></h1>
  <p id="note">The first start after installing can take up to half a minute.</p>
</main>
<script>
  // The launcher passes the app address after "#". Switch to it as soon as the local server answers.
  const url = decodeURIComponent(location.hash.slice(1)) || "http://127.0.0.1:3219/";
  const started = Date.now();
  async function poll() {
    try {
      await fetch(url, { mode: "no-cors", cache: "no-store" });
      location.replace(url);
      return;
    } catch {}
    if (Date.now() - started > 90000) {
      document.getElementById("note").textContent = "Insan did not start. Close this window and open Insan again.";
      return;
    }
    setTimeout(poll, 400);
  }
  poll();
</script>
</body>
</html>
